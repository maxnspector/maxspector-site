# CAMPAIGNS — a Collection (separate projects shown together), built 2026-10-19.
# Source art: Dropbox Case Study Files/Campaigns. Grounds follow the old maxspector.com
# (Beth Sholom + Kayu on cream; each Fandom campaign on its own color).
title: Campaigns — Max Spector
description: "Campaigns with their own visual worlds: Congregation Beth Sholom, Fandom's State of Fandom report, Kayu, and Fandom franchise features."
cover: cover.jpg
cover_mobile: cover-mobile.jpg
cover_mobile_fit: contain   # show the whole phone cover; its type runs nearly edge to edge
cover_mobile_bg: '#23CCD1'
frames: off
intro:
  eyebrow: Campaigns
  statement: "DRAFT — Campaigns that each needed a world of their own: a capital campaign for a 100-year-old congregation, an annual research report on how fans behave, a launch for a handmade accessories brand, and editorial features built around the biggest releases in entertainment."
  meta:
  - label: Roles & Responsibilities
    body: "DRAFT — Art direction and design: campaign concept, identity, print, digital, and environmental."
  - label: Clients
    body: Congregation Beth Sholom, Fandom, Kayu

sections:
- heading: Congregation Beth Sholom
  subhead: "DRAFT — Unite + Ignite, a capital campaign told across a printed brochure and the synagogue's own courtyard."
  ground: cream
  blocks:
  - layout: full
    items:
    - {img: bs-courtyard.jpg, alt: "UNITY, Light: campaign graphics on the glass doors of the Beth Sholom courtyard", aspect: 2400/1094}
  - layout: full
    space: 96
    items:
    - {img: bs-spread-unity.jpg, alt: "Brochure spread: Let us merge our lights in unity", aspect: 3/2}
  - layout: grid-2
    class: keep-row   # stays two-up on phones
    space: 96
    items:
    - {img: bs-cover.jpg, alt: "Unite + Ignite brochure cover", aspect: 3/4}
    - {img: bs-back-cover.jpg, alt: "Brochure back cover: 107 years and counting", aspect: 3/4}
  - layout: grid-2
    class: keep-row   # stays two-up on phones
    space: 96
    items:
    - {img: bs-moments-left.jpg, alt: "Brochure page: History is made up of moments", aspect: 3/4}
    - {img: bs-moments-right.jpg, alt: "Brochure page: And moment to moment, for the 107 years", aspect: 3/4}
  - layout: full
    space: 96
    items:
    - {img: bs-spread-future.jpg, alt: "Brochure spread: A bright and secure future, with the campaign's four pillars", aspect: 3/2}
  - layout: full
    space: 96
    items:
    - {img: bs-spread-families.jpg, alt: "Brochure spreads profiling congregation families", aspect: 3/2}

