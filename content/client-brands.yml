# CLIENT BRANDS — a Collection, built 2026-10-23 in Nick Pattison's board format:
# REVISED 2026-10-25 (Max): each project opens on a full-width hero at the art's own shape,
# then half-width tiles (square or near-square, ratio per project), plus extra full-width
# pieces where the art is strong and landscape. 14px between pieces. Art: assets/client-brands/v2,
# cut by _scratch/cb/make_cb2.py.
# Cover: Kayu postcard "The sun filtered" (Max 2026-10-25; tried Beth Sholom Unity, then Verve window). Archetypes removed (Max 2026-10-23).
# Tiles are made by _scratch/cb/make_tiles.py from Max's originals (Linked Art) into assets/client-brands.
# Grounds and intro copy read from the old maxspector.com/project/client-brands.
title: Client Brands — Max Spector
description: 'Brand identities for independent clients: Coffee Cultures, Verve Coffee Roasters, Venus Spirits, Craftsman and Wolves, The Brownie & Madam Optical Co., Kayu and Congregation Beth Sholom.'
cover: cover-kayu.jpg
frames: 'off'
intro:
  eyebrow: Client Brands
  statement: The power of design is to make the hidden visible, the visible relevant, and the relevant of passionate concern. The job of design is to spark intrigue and curiosity—to captivate the user,
    inspire them to disregard distractions, focus on your message—and of course, always, to tell amazing stories.
  meta:
  - label: Roles & Responsibilities
    body: Art director and lead designer. Team leadership, project management, and production. Honoring the client as partner and subject matter expert.
  - label: Design Agencies of Record
    body: Work produced at the esteemed Chen Design Associates, and my independent design practice.
sections:
- heading: Coffee Cultures
  subhead: Founded with an international spirit. Travel as the ends, not the means. Equal parts Olde England and Mel's Diner.
  ground: cream
  blocks:
  - layout: full
    items:
    - img: v2/cc-hero-pattern.jpg   # Max 2026-10-29: the old site's pattern header (Linked Art/Client_brands_header_01)
      alt: 'Coffee Cultures pattern: a grid of the brand marks, badges and type in orange, gold, cream and brown'
      aspect: 3840/2160
  - layout: grid-2
    class: keep-row
    gap: 14
    items:
    - img: v2/cc-sign.jpg
      alt: Hanging wooden Coffee Cultures sign outside the cafe
      aspect: 1200/1200
    - img: v2/cc-detail.jpg
      alt: Coffee Cultures cup, sandwich wrap and loyalty card
      aspect: 1200/1200
    - img: v2/cc-board.jpg
      alt: Coffee Cultures sandwich board covered in brand graphics
      aspect: 1200/1200
    - img: v2/cc-wall.jpg
      alt: A customer sitting beneath the Coffee Cultures mural wall
      aspect: 1200/1200
    space: 14
  - layout: bleed   # Max 2026-10-29: art smaller, its background runs edge to edge
    class: band
    items:
    - img: v2/cc-assets.jpg
      bg: '#FFFFFF'
      pad: 3
      alt: 'Coffee Cultures core assets: primary trademark, secondary icon, brand colors and typefaces'
      aspect: 1440/800
    space: 14
