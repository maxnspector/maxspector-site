span class="nm">Inputs · Navigation</span><div class="ctl"><span class="k">Search</span><div class="in"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="8.5" cy="8.5" r="6"/><path d="M13 13l5 5"/></svg>Search GameSpot</div><span class="k">Focus</span><div class="in f"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="8.5" cy="8.5" r="6"/><path d="M13 13l5 5"/></svg>Zelda</div><span class="k">Tabs</span><div class="tabs"><span>Popular</span><span>Recent</span><span class="on">Updated</span></div><span class="k">Tags</span><div class="tags"><span class="tag" style="background:#C200BB">Article</span><span class="tag" style="background:#FF2D17">Review</span><span class="tag" style="background:#004158;color:#F9EDD8">Video</span><span class="tag" style="background:#FFC500">Deal</span></div><span class="k">Icon</span><div class="icons"><span class="ib">&#8249;</span><span class="ib">&#8250;</span><span class="ib r">&#9654;</span><span class="sec">Game deals</span></div></div></div><div class="set"><span class="nm">Card / list item</span><div class="vc"><div class="im"><img src="/assets/fandom-brand/gs-ui-thumb-a.jpg" alt=""><span class="pl">&#9654;</span></div><div class="bd"><span class="tag" style="background:#C200BB">Article</span><h5>Power Rangers trailer is full of morphenomenal magic</h5><div class="mono">32 mins ago · 14 comments</div></div></div></div>'
