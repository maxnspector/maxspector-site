# FANDOM — recomposed web-first 2026-10-17 (plan: docs/fandom-recompose-plan.md).
# The first long version is kept in docs/fandom-brand-v1-backup.yml.
title: Fandom — Max Spector
description: "Building and running the Fandom brand: identity, motion, social, presentations, GameSpot and events."
cover: cover.jpg
frames: off
intro:
  eyebrow: Fandom
  statement: Produced end to end by my team at Fandom, the company’s brand identity targets the consumer
    audience with the fun, excitement, and boundless joy that come with a love of imagined worlds. To
    the business audience it tells the story of Fandom’s massive, global reach, its platform, and a diverse
    user base.
  meta:
  - label: Roles & Responsibilities
    body: Art direction, leadership, and design. Directed scope, strategy, process, timelines, and talent.
  - label: Contributing Designers
    body: Dylan Abuel, Nick Tam, Kevin Orzel, Winh Do, Risha Egart, Dermot Jiang, Colleen Starr, Eric
      Neff
  links_html: View the <a href="#">online brand assets</a> or download the full <a href="#">brand guide</a>

# Brand type and panel styles for this page only. Fonts live in assets/fandom-brand/fonts.
css: |
  @font-face{font-family:'Rubik';src:url('/assets/fandom-brand/fonts/rubik.woff2') format('woff2');font-weight:300 900;font-display:swap}
  @font-face{font-family:'Space Grotesk';src:url('/assets/fandom-brand/fonts/spacegrotesk.woff2') format('woff2');font-weight:300 700;font-display:swap}
  @font-face{font-family:'Space Mono';src:url('/assets/fandom-brand/fonts/spacemono-400.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Space Mono';src:url('/assets/fandom-brand/fonts/spacemono-700.woff2') format('woff2');font-weight:700;font-display:swap}
  @font-face{font-family:'Kanit';src:url('/assets/fandom-brand/fonts/kanit-400.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Kanit';src:url('/assets/fandom-brand/fonts/kanit-700.woff2') format('woff2');font-weight:700;font-display:swap}
  @font-face{font-family:'Kanit';src:url('/assets/fandom-brand/fonts/kanit-900.woff2') format('woff2');font-weight:900;font-display:swap}
  @font-face{font-family:'JetBrains Mono';src:url('/assets/fandom-brand/fonts/jetbrainsmono.woff2') format('woff2');font-weight:100 800;font-display:swap}
  .cs-swatches .cs-labels{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.02em}
  .gs-palette .cs-swatches .cs-labels{font-family:'JetBrains Mono',monospace}
  @media(max-width:520px){.cs-swatches .cs-labels{font-size:7px;padding:6px;letter-spacing:0}}
  .cs-html{container-type:inline-size;padding:7cqw;justify-content:space-between}
  .ty-label{font:400 max(10px,2.6cqw)/1.3 'Space Mono',monospace;display:flex;justify-content:space-between;gap:1em}
  .ty-aa{font-size:46cqw;line-height:.9;letter-spacing:-.02em}
  .ty-set{font-size:5.4cqw;line-height:1.35;overflow-wrap:anywhere}
  .ty-rubik{font-family:'Rubik';font-weight:700}
  .ty-rubik .ty-set{font-weight:400}
  .ty-grotesk{font-family:'Space Grotesk';font-weight:500}
  .ty-grotesk .ty-set{font-weight:400}
  .ty-mono{font-family:'Space Mono';font-weight:700}
  .ty-mono .ty-aa{font-size:40cqw}
  .ty-mono .ty-set{font-weight:400;font-size:4.6cqw}
  .gs-list{font-family:'Kanit'}
  .gs-list .ty-label{font-family:'JetBrains Mono';font-weight:700}
  .gs-list ul{list-style:none;margin:0;padding:0;font-weight:900;font-size:7.4cqw;line-height:1.08;text-transform:uppercase}
  .gs-list.is-not ul li{text-decoration:line-through;text-decoration-thickness:.09em;text-decoration-color:#FF2D17}

lead:
  ground: '#280033'
  blocks:
  - layout: full
    items:
    - video: motion-logo-reveal
      alt: The Fandom logo animating in, flame mark cutting through the wordmark
      ratio: video

sections:
- heading: Core Brand Elements
  subhead: Building blocks of the brand story. Logo, color, and typography.
  ground: white
  blocks:
  - layout: grid-2
    gap: 0
    items:
    - img: logo-lockup-purple.svg
      alt: Fandom primary lockup, purple wordmark with the flame mark
      ratio: wide
      bg: '#F9EDD8'
      pad: 16
    - img: logo-lockup-cream.svg
      alt: Fandom primary lockup reversed, cream wordmark on purple black
      ratio: wide
      bg: '#280033'
      pad: 16
  - layout: grid-3
    gap: 0
    items:
    - img: logo-stacked-purple.svg
      alt: Fandom stacked lockup on light blue
      bg: '#86D7DC'
      pad: 24
    - img: logo-mark.svg
      alt: The Fandom flame mark on purple
      bg: '#520044'
      pad: 26
    - img: logo-stacked-b-cream.svg
      alt: Fandom stacked lockup, alternate arrangement, on cornflower
      bg: '#6A68CE'
      pad: 22
  - layout: full
    items:
    - swatches:
      - {name: Fandom Red, hex: '#FA005A', column: span 4}
      - {name: Fandom Yellow, hex: '#FFC500', column: span 4}
      - {name: Fandom Purple, hex: '#520044', column: span 4}
      - {name: Cream, hex: '#F9EDD8', column: span 3}
      - {name: Light Blue, hex: '#86D7DC', column: span 3}
      - {name: Cornflower, hex: '#6A68CE', column: span 3}
      - {name: Crimson, hex: '#9B004E', column: span 3}
      - {name: Dark Gray, hex: '#3A434B', column: span 3}
      - {name: Light Gray, hex: '#838D86', column: span 3}
      - {name: Purple Black, hex: '#280033', column: span 3}
      - {name: Brown, hex: '#C16900', column: span 3}
      cols: repeat(12,1fr)
      rows: 2fr 1fr 1fr
      alt: 'Fandom palette: lead colors red, yellow and purple, then eight secondaries'
      aspect: 1200/640
  - layout: grid-3
    gap: 0
    items:
    - html: <div class="ty-label"><span>Rubik</span><span>Display & body</span></div><div class="ty-aa">Aa</div><div class="ty-set">ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz 0123456789</div>
      html_class: ty-rubik
      alt: Rubik, the display and body typeface
      bg: '#520044'
      ink: '#F9EDD8'
      ratio: tall
    - html: <div class="ty-label"><span>Space Grotesk</span><span>Headlines</span></div><div class="ty-aa">Aa</div><div class="ty-set">ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz 0123456789</div>
      html_class: ty-grotesk
      alt: Space Grotesk typeface
      bg: '#FFC500'
      ink: '#520044'
      ratio: tall
    - html: <div class="ty-label"><span>Space Mono</span><span>Accents & data</span></div><div class="ty-aa">Aa</div><div class="ty-set">ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz 0123456789</div>
      html_class: ty-mono
      alt: Space Mono, the accent and data typeface
      bg: '#FA005A'
      ink: '#F9EDD8'
      ratio: tall

- heading: Visual Language
  subhead: Photo treatments, illustration, and iconography. A house style broad enough to hold every fandom.
  ground: '#F9EDD8'
  blocks:
  - layout: grid-4
    gap: 0
    items:
    - img: cutout-black-widow.webp
      alt: Black Widow in the Fandom duotone photo treatment
      ratio: tall
      bg: '#86D7DC'
      pad: 8
      align: bottom
    - img: cutout-isabelle.webp
      alt: Isabelle from Animal Crossing in the duotone treatment
      ratio: tall
      bg: '#520044'
      pad: 10
      align: bottom
    - img: cutout-miles.webp
      alt: Miles Morales mid-leap in the duotone treatment
      ratio: tall
      bg: '#FFC500'
      pad: 6
    - img: cutout-harry.webp
      alt: Harry Potter in the duotone treatment
      ratio: tall
      bg: '#6A68CE'
      pad: 10
      align: bottom
  - layout: full
    items:
    - img: personas.jpg
      alt: The five Fandom personas, illustrated in the house style
      aspect: 1920/1265
  - layout: grid-4
    gap: 0
    items:
    - {img: icon-mushroom.svg, alt: Mushroom icon, bg: '#86D7DC', pad: 20}
    - {img: icon-lightsabers.svg, alt: Lightsabers icon, bg: '#280033', pad: 20}
    - {img: icon-shield.svg, alt: Shield icon, bg: '#FA005A', pad: 20}
    - {img: icon-delorean.svg, alt: Time-machine car icon, bg: '#6A68CE', pad: 20}
    - {img: icon-rupee.svg, alt: Rupee icon, bg: '#86D7DC', pad: 20}
    - {img: icon-snitch.svg, alt: Golden snitch icon, bg: '#280033', pad: 20}
    - {img: icon-demogorgon.svg, alt: Demogorgon icon, bg: '#FA005A', pad: 20}
    - {img: icon-tiara.svg, alt: Tiara icon, bg: '#6A68CE', pad: 20}
    - {img: icon-pokeball.svg, alt: Pokeball icon, bg: '#86D7DC', pad: 20}
    - {img: icon-d20.svg, alt: Twenty-sided die icon, bg: '#280033', pad: 20}
    - {img: icon-portal.svg, alt: Portal gun icon, bg: '#FA005A', pad: 20}
    - {img: icon-alien.svg, alt: Three-eyed alien icon, bg: '#6A68CE', pad: 20}

- heading: Motion Design
  subhead: Expressing the brand attributes of passion, celebration, and wonder.
  ground: '#520044'
  blocks:
  - layout: full
    items:
    - video: motion-love-of-fans
      alt: For the love of fans, the brand tagline animated
      ratio: video
  - layout: full
    items:
    - video: motion-persona-network
      alt: The Fandom personas connecting into a network
      ratio: video
  - layout: grid-2
    items:
    - video: motion-mark-pattern
      alt: The flame mark repeated as a moving pattern
      ratio: video
    - video: motion-by-the-numbers
      alt: By the Numbers show open
      ratio: video

- heading: Social Content
  subhead: One system, many franchises. Data stories, character breakdowns, and explainers made for each fandom.
  ground: '#86D7DC'
  blocks:
  - layout: grid-2
    items:
    - {img: social-andor-empire.jpg, alt: "Andor social takeover: the Empire", ratio: portrait}
    - {img: social-andor-resistance.jpg, alt: "Andor social takeover: the Resistance", ratio: portrait}
  - layout: full
    items:
    - {img: social-tomcruise.jpg, alt: Tom Cruise by the numbers, ratio: wide}
  - layout: grid-3
    items:
    - {img: social-eddie.jpg, alt: Eddie Munson wiki data post, ratio: portrait}
    - {img: social-dumbledore.jpg, alt: Dumbledore facts post, ratio: portrait}
    - {img: social-johnwick-v2.jpg, alt: John Wick by the numbers, ratio: portrait}
  - layout: grid-2
    items:
    - {img: social-glass-onion-a.jpg, alt: Glass Onion data post, ratio: portrait}
    - {img: social-glass-onion-b.jpg, alt: Glass Onion odds post, ratio: portrait}
  - layout: full
    items:
    - {img: social-bond.jpg, alt: The Daniel Craig era of James Bond charted, ratio: video}

- heading: Presentation Design
  subhead: The business of making people forget they’re viewing a slide deck.
  ground: white
  blocks:
  - layout: full
    items:
    - {img: pres-context-matters.jpg, alt: "Go-to-market deck: context matters", ratio: video}
  - layout: grid-2
    items:
    - {img: pres-allhands-2024.jpg, alt: 2024 all-hands look-ahead title slide, ratio: video}
    - {img: pres-allhands-2025-v2.jpg, alt: 2025 all-hands kickoff title slide, ratio: video}
  - layout: grid-2
    items:
    - {img: pres-reach-fans.jpg, alt: "Go-to-market deck: reach fans in every market", ratio: video}
    - {img: pres-work-together.jpg, alt: "Partner deck: how should we work together in 2025", ratio: video}

- heading: GameSpot
  subhead: A diverse content brand that keeps games as its core while embracing other entertainment media.
  ground: '#00191D'
  blocks:
  - layout: grid-2
    gap: 0
    items:
    - {img: gs-logo-darkblue.svg, alt: GameSpot primary logo in dark blue on yellow, ratio: wide, bg: '#FFC500', pad: 18}
    - {img: gs-logo-yellow.svg, alt: GameSpot primary logo in yellow on blue, ratio: wide, bg: '#004158', pad: 18}
    - {img: gs-mark-darkblue.svg, alt: GameSpot secondary mark, the circled G, ratio: wide, bg: '#F9EDD8', pad: 22}
    - {img: gs-spot-on.webp, alt: Spot On sub-brand logo, ratio: wide, bg: '#FF2D17', pad: 14}
  - layout: grid-2
    gap: 0
    items:
    - html: <div class="ty-label"><span>GameSpot is…</span><span>01</span></div><ul><li>Informative</li><li>Accurate</li><li>Inclusive</li><li>Funny</li><li>Consistent</li><li>Passionate</li><li>Conversational</li><li>Respectful</li><li>Honest</li></ul>
      html_class: gs-list
      alt: "GameSpot is informative, accurate, inclusive, funny, consistent, passionate, conversational, respectful, honest"
      bg: '#FFC500'
      ink: '#00191D'
    - html: <div class="ty-label"><span>GameSpot is not…</span><span>02</span></div><ul><li>Snarky</li><li>Jaded</li><li>Self-indulgent</li><li>Industry-centric</li><li>Exclusionary</li><li>Gossipy</li></ul>
      html_class: gs-list is-not
      alt: "GameSpot is not snarky, jaded, self-indulgent, industry-centric, exclusionary or gossipy"
      bg: '#F9EDD8'
      ink: '#00191D'
  - layout: full
    class: gs-palette
    items:
    - swatches:
      - {name: GameSpot Yellow, hex: '#FFC500'}
      - {name: Red Orange, hex: '#FF2D17'}
      - {name: Fuchsia, hex: '#C200BB'}
      - {name: Blue, hex: '#004158'}
      - {name: Dark Blue, hex: '#00191D'}
      - {name: Cream, hex: '#F9EDD8'}
      cols: 2fr repeat(5,1fr)
      alt: 'GameSpot palette: yellow, red orange, fuchsia, blue, dark blue and cream'
      aspect: 1200/360
  - layout: grid-3
    items:
    - {img: gs-social-news.jpg, alt: "GameSpot news card: Blizzard's Overwatch team unionizes", ratio: portrait}
    - {img: gs-social-quote.jpg, alt: GameSpot quote card with Jeremy Renner, ratio: portrait}
    - {img: gs-social-news-2.jpg, alt: "GameSpot news card: Final Fantasy VII Remake trilogy coming to Switch 2", ratio: portrait}
  - layout: grid-3
    items:
    - {img: gs-review-clair.jpg, alt: "GameSpot review card: Clair Obscur, 9 out of 10"}
    - {img: gs-review-doom.jpg, alt: "GameSpot review card: Doom The Dark Ages, 8 out of 10"}
    - {img: gs-review-savage.jpg, alt: "GameSpot review card: Revenge of the Savage Planet, 8 out of 10"}

