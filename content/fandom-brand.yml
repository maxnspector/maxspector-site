# FANDOM — recomposed web-first 2026-10-17 (plan: docs/fandom-recompose-plan.md).
# The first long version is kept in docs/fandom-brand-v1-backup.yml.
title: Fandom — Max Spector
description: "Building and running the Fandom brand: identity, motion, social, presentations, GameSpot and events."
cover: cover.jpg
frames: off
intro:
  eyebrow: Fandom
  statement: Produced end to end by my team at Fandom, the company’s brand identity targets the consumer
    audience with the fun, excitement, and boundless joy that come with a love of imagined worlds. To
    the business audience it tells the story of Fandom’s massive, global reach, its platform, and a diverse
    user base.
  meta:
  - label: Roles & Responsibilities
    body: Art direction, leadership, and design. Directed scope, strategy, process, timelines, and talent.
  - label: Contributing Designers
    body: Dylan Abuel, Nick Tam, Kevin Orzel, Winh Do, Risha Egart, Dermot Jiang, Colleen Starr, Eric
      Neff
  links_html: View the <a href="#">online brand assets</a> or download the full <a href="#">brand guide</a>

# Brand type and panel styles for this page only. Fonts live in assets/fandom-brand/fonts.
css: |
  @font-face{font-family:'Rubik';src:url('/assets/fandom-brand/fonts/rubik.woff2') format('woff2');font-weight:300 900;font-display:swap}
  @font-face{font-family:'Space Grotesk';src:url('/assets/fandom-brand/fonts/spacegrotesk.woff2') format('woff2');font-weight:300 700;font-display:swap}
  @font-face{font-family:'Space Mono';src:url('/assets/fandom-brand/fonts/spacemono-400.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Space Mono';src:url('/assets/fandom-brand/fonts/spacemono-700.woff2') format('woff2');font-weight:700;font-display:swap}
  @font-face{font-family:'Kanit';src:url('/assets/fandom-brand/fonts/kanit-400.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Kanit';src:url('/assets/fandom-brand/fonts/kanit-700.woff2') format('woff2');font-weight:700;font-display:swap}
  @font-face{font-family:'Kanit';src:url('/assets/fandom-brand/fonts/kanit-900.woff2') format('woff2');font-weight:900;font-display:swap}
  @font-face{font-family:'JetBrains Mono';src:url('/assets/fandom-brand/fonts/jetbrainsmono.woff2') format('woff2');font-weight:100 800;font-display:swap}
  .cs-swatches .cs-labels{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.02em}
  .gs-palette .cs-swatches .cs-labels{font-family:'JetBrains Mono',monospace}
  @media(max-width:520px){.cs-swatches .cs-labels{font-size:7px;padding:6px;letter-spacing:0}}
  .cs-html{container-type:inline-size;padding:7cqw;justify-content:space-between}
  .ty-label{font:400 max(10px,2.6cqw)/1.3 'Space Mono',monospace;display:flex;justify-content:space-between;gap:1em}
  /* Type: one wide Rubik display, then the two secondary faces as short panels */
  .ty-display{padding:4.5cqw}
  .ty-display .ty-label{font-size:max(10px,1.1cqw)}
  .ty-display .ty-main{display:flex;justify-content:space-between;align-items:flex-end;gap:4cqw}
  .ty-display .ty-aa{font-family:'Rubik';font-weight:700;font-size:15.5cqw;line-height:.8;letter-spacing:-.02em;white-space:nowrap}
  .ty-display .ty-weights{font-family:'Rubik';font-size:max(10px,1.45cqw);line-height:1.4;text-align:right;white-space:nowrap}
  .ty-display .ty-set{font-family:'Rubik';font-weight:400;font-size:2.15cqw;line-height:1.3}
  .ty-small{padding:5.5cqw}
  .ty-small .ty-label{font-size:max(10px,2cqw)}
  .ty-small .ty-aa{font-size:21cqw;line-height:.85;letter-spacing:-.01em;white-space:nowrap}
  .ty-small .ty-set{font-size:3.3cqw;line-height:1.35;overflow-wrap:anywhere}
  .ty-grotesk{font-family:'Space Grotesk';font-weight:500}
  .ty-grotesk .ty-set{font-weight:400}
  .ty-mono{font-family:'Space Mono';font-weight:700}
  .ty-mono .ty-aa{font-size:18cqw}
  .ty-mono .ty-set{font-weight:400;font-size:2.9cqw}
  /* Photo treatments: Max's original grid; the figures break out past the tiles */
  .cs-img.pt{overflow:visible;padding:0;aspect-ratio:auto;background:none}
  .cs-img.pt img{display:block;width:101.35%;max-width:none;height:auto;margin-left:-1.35%}
  /* Sub-brand logos on white, each sized to the same visual area */
  .cs-img.sb{padding:0;aspect-ratio:auto;display:grid;grid-template-columns:repeat(4,1fr);background:none}
  .sb-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  .sb-cell img{height:auto;max-height:82%;object-fit:contain}
  @media(max-width:520px){.cs-img.sb{grid-template-columns:repeat(2,1fr)}}
  /* Phones: lockups keep a readable size, palette regroups, type stacks */
  @media(max-width:860px){
    .core-lockups .cs-img:first-child{--pad:9%!important}
    .core-lockups .cs-img:last-child{--pad:12%!important}
  }
  @media(max-width:520px){
    .core-palette .cs-swatches{grid-template-columns:repeat(12,1fr)!important;grid-template-rows:none!important;aspect-ratio:auto!important}
    .core-palette .cs-swatch{grid-row:auto!important;grid-column:span 3;aspect-ratio:3/4}
    .core-palette .cs-swatch:nth-child(-n+3){grid-column:span 4;aspect-ratio:1}
    .core-palette .cs-swatch:nth-child(n+8){aspect-ratio:1}
    .ty-display{aspect-ratio:auto!important;gap:20px}
    .ty-display .ty-label{font-size:10px}
    .ty-display .ty-main{flex-direction:column;align-items:flex-start;gap:14px}
    .ty-display .ty-aa{font-size:22cqw}
    .ty-display .ty-weights{display:flex;flex-wrap:wrap;row-gap:2px;text-align:left;white-space:normal;font-size:12px}
    .ty-display .ty-weights br{display:none}
    .ty-display .ty-weights span{margin-right:.7em}
    .ty-display .ty-set{font-size:3.6cqw}
  }
  /* GameSpot is / is not: the brand guide's own treatment. Kanit Black heads, JetBrains Mono on highlight bars */
  .cs-html.gs-list{padding:10cqw 9cqw;justify-content:flex-start}
  .gs-list h3{margin:0 0 6cqw;font:900 7.6cqw/1 'Kanit';color:#00191D}
  .gs-list.is-not h3{color:#FF2D17}
  .gs-list ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.5cqw;font:700 4.5cqw/1 'JetBrains Mono'}
  .gs-list li{display:flex;align-items:center}
  .gs-list li::before{content:'+';color:#FF2D17;width:1.15em;flex:none}
  .gs-list li span{background:#FFC500;color:#00191D;padding:.42em .12em .38em}
  .gs-list.is-not li::before{content:'\2260'}
  .gs-list.is-not li span{background:#00191D;color:#FF2D17}
  /* GameSpot core UI: a small kit built from the guide, set beside the homepage */
  .cs-html.gs-ui{padding:10.5cqw 6cqw 6cqw;justify-content:flex-start;position:relative;font-family:'Kanit'}
  .gs-ui .stp{position:absolute;left:0;right:0;top:0;height:5cqw;display:grid;grid-template-rows:repeat(5,1fr)}
  .gs-ui .stp i:nth-child(1){background:#FF2D17}.gs-ui .stp i:nth-child(2){background:#C200BB}.gs-ui .stp i:nth-child(3){background:#00191D}.gs-ui .stp i:nth-child(4){background:#004158}.gs-ui .stp i:nth-child(5){background:#FFC500}
  .gs-ui .lbl{font:700 1.9cqw/1 'JetBrains Mono';letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between;border-bottom:.25cqw solid #00191D;padding-bottom:1.2cqw;margin:0 0 2.4cqw}
  .gs-ui .blk{margin-bottom:3.8cqw}.gs-ui .blk:last-child{margin-bottom:0}
  .gs-ui .sw{display:grid;grid-template-columns:2fr repeat(5,1fr);height:6.5cqw}
  .gs-ui .sw span{font:500 1.55cqw/1 'JetBrains Mono';padding:1.3cqw;display:flex;align-items:flex-end}
  .gs-ui .ty{display:grid;grid-template-columns:1fr auto;align-items:baseline;row-gap:1.5cqw;column-gap:3cqw}
  .gs-ui .ty small{font:500 1.55cqw/1 'JetBrains Mono';opacity:.6;text-align:right;white-space:nowrap}
  .gs-ui .t1{font-weight:900;font-size:6.6cqw;line-height:.9;text-transform:uppercase}
  .gs-ui .t3{font-weight:700;font-size:2.9cqw;line-height:1.1}
  .gs-ui .t4{font-weight:400;font-size:2.2cqw;line-height:1.35}
  .gs-ui .t5{font:700 2cqw/1 'JetBrains Mono';color:#C200BB;letter-spacing:.04em}
  .gs-ui .row{display:flex;flex-wrap:wrap;gap:2cqw;align-items:center}
  .gs-ui .row+.row{margin-top:2.2cqw}
  .gs-ui .btn{font:900 2.3cqw/1 'Kanit';text-transform:uppercase;padding:1.7cqw 3cqw;letter-spacing:.02em}
  .gs-ui .b1{background:#FFC500}.gs-ui .b2{background:#00191D;color:#FFC500}.gs-ui .b3{box-shadow:inset 0 0 0 .35cqw #00191D}
  .gs-ui .ic{width:5.4cqw;height:5.4cqw;display:grid;place-items:center;background:#00191D;color:#F9EDD8;font-size:2.4cqw}
  .gs-ui .ic.r{border-radius:50%;font-size:1.9cqw}
  .gs-ui .tag{font:900 1.9cqw/1 'Kanit';text-transform:uppercase;padding:.5cqw .9cqw}
  .gs-ui .sec{font:900 3.4cqw/1 'Kanit';text-transform:uppercase;background:#FFC500;padding:1cqw 1.8cqw}
  .gs-ui .tabs{display:flex;border-top:.25cqw solid;border-bottom:.25cqw solid;font:900 2.6cqw/1 'Kanit';text-transform:uppercase;margin-top:2.4cqw}
  .gs-ui .tabs span{padding:1.6cqw 2.2cqw 1.4cqw}.gs-ui .tabs span:first-child{padding-left:0}.gs-ui .tabs .on{background:#FFC500;padding-left:2.2cqw}
  .gs-ui .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqw}
  .gs-ui .card{border-top:.8cqw solid #FF2D17}
  .gs-ui .card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
  .gs-ui .card h4{margin:1.3cqw 0 0;font:700 2cqw/1.15 'Kanit'}
  .gs-ui .card.dk{background:#00191D;color:#F9EDD8}
  .gs-ui .card.dk h4{padding:0 1.4cqw 1.6cqw}

sections:
- heading: Core Brand Elements
  subhead: Building blocks of the brand story. Logo, color, and typography.
  ground: white
  blocks:
  - layout: full
    items:
    - video: motion-logo-reveal
      alt: The Fandom logo animating in, flame mark cutting through the wordmark
      ratio: video
  - layout: asym-left
    class: core-lockups
    gap: 0
    space: 96
    cols: 3fr 2fr   # cream panel = width of the three primaries below
    items:
    - img: logo-lockup-purple.svg
      alt: Fandom primary lockup, purple wordmark with the flame mark, on cream
      bg: '#F9EDD8'
      pad: 15
    - img: logo-stacked-b-cream.svg
      alt: Fandom stacked lockup reversed in cream, on Fandom purple
      bg: '#520044'
      pad: 27
  - layout: full
    class: core-palette
    space: 0   # butts against the lockups above
    items:
    - swatches:
      - {name: Fandom Red, hex: '#FA005A', row: 1 / 3}
      - {name: Fandom Yellow, hex: '#FFC500', row: 1 / 3}
      - {name: Fandom Purple, hex: '#520044', row: 1 / 3}
      - {name: Cream, hex: '#F9EDD8', hide_name: true}
      - {name: Light Blue, hex: '#86D7DC', hide_name: true}
      - {name: Cornflower, hex: '#6A68CE', hide_name: true}
      - {name: Crimson, hex: '#9B004E', hide_name: true}
      - {name: Dark Gray, hex: '#3A434B', hide_name: true}
      - {name: Light Gray, hex: '#838D86', hide_name: true}
      - {name: Purple Black, hex: '#280033', hide_name: true}
      - {name: Brown, hex: '#C16900', hide_name: true}
      cols: 2fr 2fr 2fr 1fr 1fr 1fr 1fr
      rows: 3fr 2fr   # secondaries (top) taller than tertiaries (bottom)
      alt: 'Fandom palette: primaries red, yellow and purple, then four secondaries over four tertiaries'
      aspect: 1200/440
  - layout: full
    space: 96
    items:
    - html: <div class="ty-label"><span>Rubik</span><span>Primary typeface · display and body</span></div><div class="ty-main"><div class="ty-aa">Aa Bb Cc</div><div class="ty-weights"><span style="font-weight:300">Light</span><br><span style="font-weight:400">Regular</span><br><span style="font-weight:500">Medium</span><br><span style="font-weight:600">SemiBold</span><br><span style="font-weight:700">Bold</span><br><span style="font-weight:800">ExtraBold</span><br><span style="font-weight:900">Black</span></div></div><div class="ty-set">ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>abcdefghijklmnopqrstuvwxyz<br>1234567890!@#$%^&amp;*()</div>
      html_class: ty-display
      alt: Rubik, the primary typeface, in its seven weights
      bg: '#520044'
      ink: '#FFC500'
      aspect: 1200/540
  - layout: grid-2
    gap: 0
    space: 0   # butts against the Rubik panel above
    items:
    - html: <div class="ty-label"><span>Space Grotesk</span><span>Headlines</span></div><div class="ty-aa">Aa Bb Cc</div><div class="ty-set">ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz 0123456789</div>
      html_class: ty-small ty-grotesk
      alt: Space Grotesk, the headline typeface
      bg: '#FFC500'
      ink: '#520044'
      aspect: 600/360
    - html: <div class="ty-label"><span>Space Mono</span><span>Accents and data</span></div><div class="ty-aa">Aa Bb Cc</div><div class="ty-set">ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz 0123456789</div>
      html_class: ty-small ty-mono
      alt: Space Mono, the accent and data typeface
      bg: '#F9EDD8'
      ink: '#FA005A'
      aspect: 600/360

- heading: Styles and Image Treatments
  subhead: Photo treatments, illustration, and iconography. A house style broad enough to hold every fandom.
  ground: white
  blocks:
  - layout: full
    items:
    - img: personas.jpg
      alt: The five Fandom personas, illustrated in the house style
      aspect: 1920/1265
  # Built in Figma (82:16878 + 82:13986), exported 2x. Two adjacent blocks; stack on phones.
  - layout: flush-pair
    space: 96
    items:
    - img: vl-chars-pair.jpg
      alt: Miles Morales, Black Widow, Harry Potter and Isabelle in the Fandom duotone photo treatment, on brand-color panels
      aspect: 600/640
    - img: vl-icons-pair.jpg
      alt: Sixteen Fandom icons in four brand-color columns
      aspect: 600/640

- heading: Motion Design
  subhead: Expressing the brand attributes of passion, celebration, and wonder.
  ground: cream
  blocks:
  - layout: full
    items:
    - video: motion-love-of-fans
      alt: For the love of fans, the brand tagline animated
      ratio: video
  - layout: full
    items:
    - video: motion-persona-network
      alt: The Fandom personas connecting into a network
      ratio: video
  - layout: grid-2
    items:
    - video: motion-mark-pattern
      alt: The flame mark repeated as a moving pattern
      ratio: video
    - video: motion-by-the-numbers
      alt: By the Numbers show open
      ratio: video

- heading: Social Content
  subhead: One system, many franchises. Data stories, character breakdowns, and explainers made for each fandom.
  ground: '#280033'
  blocks:
  # Layout from Figma 82:27077, exported 2x. Rows of adjacent blocks, 48px apart; blocks stack on phones.
  - layout: grid-2
    cols: 640fr 560fr
    gap: 0
    items:
    - {img: social-jw-panel.jpg, alt: "John Wick by the numbers, on a periwinkle panel", aspect: 640/700}
    - {img: social-knives-out.jpg, alt: "Oddsmaker determines the Knives Out 2 killer", aspect: 560/700}
  - layout: full
    space: 48
    items:
    - {img: social-bond.jpg, alt: "The Daniel Craig era of Bond, carousel shown as one strip", aspect: 1200/675}
  - layout: full
    space: 48
    items:
    - {img: social-stories-trio.jpg, alt: "Andor social takeover, Sonic's top speed story, and Guess the Higher Metascore story", aspect: 2400/1239}

- heading: Presentation Design
  subhead: The business of making people forget they’re viewing a slide deck.
  ground: '#6A68CE'
  blocks:
  - layout: full
    items:
    - {img: pres-template-collage.jpg, alt: Fandom presentation template system, title and section slides, aspect: 2400/1600}
  - layout: full
    space: 96
    items:
    - {img: pres-context-matters.jpg, alt: "Go-to-market deck: context matters", ratio: video}
  - layout: grid-2
    items:
    - {img: pres-allhands-2024.jpg, alt: 2024 all-hands look-ahead title slide, ratio: video}
    - {img: pres-allhands-2025-v2.jpg, alt: 2025 all-hands kickoff title slide, ratio: video}
  - layout: grid-2
    items:
    - {img: pres-reach-fans.jpg, alt: "Go-to-market deck: reach fans in every market", ratio: video}
    - {img: pres-work-together.jpg, alt: "Partner deck: how should we work together in 2025", ratio: video}

- heading: GameSpot
  subhead: A diverse content brand that keeps games as its core while embracing other entertainment media.
  ground: '#00191D'
  blocks:
  - layout: full
    items:
    - video: gs-sizzle
      alt: GameSpot brand sizzle, show packages and on-air graphics
      ratio: video
  - layout: grid-2
    gap: 0
    space: 96
    items:
    - html: '<h3>GameSpot is…</h3><ul><li><span>Informative</span></li><li><span>Accurate</span></li><li><span>Inclusive</span></li><li><span>Funny/Entertaining</span></li><li><span>Consistent</span></li><li><span>Passionate</span></li><li><span>Conversational</span></li><li><span>Respectful</span></li><li><span>Honest</span></li></ul>'
      html_class: gs-list
      alt: "GameSpot is informative, accurate, inclusive, funny/entertaining, consistent, passionate, conversational, respectful, honest"
      bg: '#FFFFFF'
      ink: '#00191D'
    - html: '<h3>GameSpot is not…</h3><ul><li><span>Snarky</span></li><li><span>Jaded</span></li><li><span>Self-Indulgent</span></li><li><span>Industry-Centric</span></li><li><span>Exclusionary</span></li><li><span>Gossipy</span></li></ul>'
      html_class: gs-list is-not
      alt: "GameSpot is not snarky, jaded, self-indulgent, industry-centric, exclusionary or gossipy"
      bg: '#FFFFFF'
      ink: '#00191D'
  - layout: full
    class: gs-palette
    items:
    - swatches:
      - {name: GameSpot Yellow, hex: '#FFC500'}
      - {name: Red Orange, hex: '#FF2D17'}
      - {name: Fuchsia, hex: '#C200BB'}
      - {name: Blue, hex: '#004158'}
      - {name: Dark Blue, hex: '#00191D'}
      - {name: Cream, hex: '#F9EDD8'}
      cols: 2fr repeat(5,1fr)
      alt: 'GameSpot palette: yellow, red orange, fuchsia, blue, dark blue and cream'
      aspect: 1200/360
  - layout: grid-3
    space: 96
    items:
    - {img: gs-social-news.jpg, alt: "GameSpot news card: Blizzard's Overwatch team unionizes", ratio: portrait}
    - {img: gs-social-quote.jpg, alt: GameSpot quote card with Jeremy Renner, ratio: portrait}
    - {img: gs-social-news-2.jpg, alt: "GameSpot news card: Final Fantasy VII Remake trilogy coming to Switch 2", ratio: portrait}
  - layout: full
    space: 96
    items:
    - video: gs-review-anim
      alt: GameSpot review score animation
      ratio: video
  - layout: grid-2
    space: 96
    items:
    - {img: gs-homepage.jpg, alt: GameSpot homepage in the 2023 brand, aspect: 1584/1742}
    - html: '<div class="stp"><i></i><i></i><i></i><i></i><i></i></div><div class="blk"><div class="lbl"><span>Color</span><span>01</span></div><div class="sw"><span style="background:#FFC500">Yellow</span><span style="background:#FF2D17">Red Orange</span><span style="background:#C200BB;color:#F9EDD8">Fuchsia</span><span style="background:#004158;color:#F9EDD8">Blue</span><span style="background:#00191D;color:#F9EDD8">Dark Blue</span><span style="background:#F9EDD8;box-shadow:inset 0 0 0 .25cqw #00191D">Cream</span></div></div><div class="blk"><div class="lbl"><span>Type</span><span>02</span></div><div class="ty"><div class="t1">Game on</div><small>Kanit Black</small><div class="t3">Everything to know about the trailer</div><small>Kanit Bold</small><div class="t4">Guides, walkthroughs, explainers and reviews.</div><small>Kanit Regular</small><div class="t5">// NEWS &nbsp;VIA: GAMESPOT</div><small>JetBrains Mono</small></div></div><div class="blk"><div class="lbl"><span>Controls</span><span>03</span></div><div class="row"><span class="btn b1">Read review</span><span class="btn b2">Watch now</span><span class="btn b3">See all</span><span class="ic">&#8249;</span><span class="ic">&#8250;</span><span class="ic r">&#9654;</span></div><div class="row"><span class="sec">Game deals</span><span class="tag" style="background:#C200BB">Article</span><span class="tag" style="background:#FF2D17">Review</span><span class="tag" style="background:#004158;color:#F9EDD8">Video</span></div><div class="tabs"><span>Popular</span><span>Recent</span><span class="on">Updated</span></div></div><div class="blk"><div class="lbl"><span>Cards</span><span>04</span></div><div class="cards"><div class="card"><img src="/assets/fandom-brand/gs-ui-thumb-c.jpg" alt="" loading="lazy"><h4>Everything to know about the new Jedi cameo</h4></div><div class="card"><img src="/assets/fandom-brand/gs-ui-thumb-a.jpg" alt="" loading="lazy"><h4>Power Rangers trailer is full of morphenomenal magic</h4></div><div class="card dk"><img src="/assets/fandom-brand/gs-ui-thumb-b.jpg" alt="" loading="lazy"><h4>Burning Shores DLC preorders are live</h4></div></div></div>'
      html_class: gs-ui
      alt: "GameSpot core UI: color, type, buttons, tags, tabs and cards"
      bg: '#F9EDD8'
      ink: '#00191D'
      aspect: 1584/1742

- heading: Sub-Brands
  id: show-formats-and-sub-brands
  subhead: A brand of brands has lots of… well, brands.
  ground: white
  blocks:
