    - {img: subbrand-fandom-fest.svg, alt: Fandom Fest, bg: '#280033', pad: 14}
    - {img: subbrand-fandom-stars.svg, alt: Fandom Stars, bg: '#86D7DC', pad: 14}
    - {img: subbrand-fandna.svg, alt: FanDNA, bg: '#F9EDD8', pad: 20}
    - {img: subbrand-global-sales.svg, alt: Fandom Global Sales Meeting, bg: '#FFC500', pad: 14}
