# FANDOM — recomposed web-first 2026-10-17 (plan: docs/fandom-recompose-plan.md).
# The first long version is kept in docs/fandom-brand-v1-backup.yml.
title: Fandom — Max Spector
description: "Building and running the Fandom brand: identity, motion, social, presentations, GameSpot and events."
cover: cover.jpg
frames: off
intro:
  eyebrow: Fandom
  statement: Produced end to end by my team at Fandom, the company’s brand identity targets the consumer
    audience with the fun, excitement, and boundless joy that come with a love of imagined worlds. To
    the business audience it tells the story of Fandom’s massive, global reach, its platform, and a diverse
    user base.
  meta:
  - label: Roles & Responsibilities
    body: Art direction, leadership, and design. Directed scope, strategy, process, timelines, and talent.
  - label: Contributing Designers
    body: Dylan Abuel, Nick Tam, Kevin Orzel, Winh Do, Risha Egart, Dermot Jiang, Colleen Starr, Eric
      Neff
  links_html: View the <a href="#">online brand assets</a> or download the full <a href="#">brand guide</a>

# Brand type and panel styles for this page only. Fonts live in assets/fandom-brand/fonts.
css: |
  @font-face{font-family:'Rubik';src:url('/assets/fandom-brand/fonts/rubik.woff2') format('woff2');font-weight:300 900;font-display:swap}
  @font-face{font-family:'Space Grotesk';src:url('/assets/fandom-brand/fonts/spacegrotesk.woff2') format('woff2');font-weight:300 700;font-display:swap}
  @font-face{font-family:'Space Mono';src:url('/assets/fandom-brand/fonts/spacemono-400.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Space Mono';src:url('/assets/fandom-brand/fonts/spacemono-700.woff2') format('woff2');font-weight:700;font-display:swap}
  @font-face{font-family:'Kanit';src:url('/assets/fandom-brand/fonts/kanit-400.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Kanit';src:url('/assets/fandom-brand/fonts/kanit-700.woff2') format('woff2');font-weight:700;font-display:swap}
  @font-face{font-family:'Kanit';src:url('/assets/fandom-brand/fonts/kanit-900.woff2') format('woff2');font-weight:900;font-display:swap}
  @font-face{font-family:'JetBrains Mono';src:url('/assets/fandom-brand/fonts/jetbrainsmono.woff2') format('woff2');font-weight:100 800;font-display:swap}
  .cs-swatches .cs-labels{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.02em}
  .gs-palette .cs-swatches .cs-labels{font-family:'JetBrains Mono',monospace}
  @media(max-width:520px){.cs-swatches .cs-labels{font-size:7px;padding:6px;letter-spacing:0}}
  .cs-html{container-type:inline-size;padding:7cqw;justify-content:space-between}
  .ty-label{font:400 max(10px,2.6cqw)/1.3 'Space Mono',monospace;display:flex;justify-content:space-between;gap:1em}
  /* Type: one wide Rubik display, then the two secondary faces as short panels */
  .ty-display{padding:4.5cqw}
  .ty-display .ty-label{font-size:max(10px,1.1cqw)}
  .ty-display .ty-main{display:flex;justify-content:space-between;align-items:flex-end;gap:4cqw}
  .ty-display .ty-aa{font-family:'Rubik';font-weight:700;font-size:15.5cqw;line-height:.8;letter-spacing:-.02em;white-space:nowrap}
  .ty-display .ty-weights{font-family:'Rubik';font-size:max(10px,1.45cqw);line-height:1.4;text-align:right;white-space:nowrap}
  .ty-display .ty-set{font-family:'Rubik';font-weight:400;font-size:2.15cqw;line-height:1.3}
  .ty-small{padding:5.5cqw}
  .ty-small .ty-label{font-size:max(10px,2cqw)}
  .ty-small .ty-aa{font-size:21cqw;line-height:.85;letter-spacing:-.01em;white-space:nowrap}
  .ty-small .ty-set{font-size:3.3cqw;line-height:1.35;overflow-wrap:anywhere}
  .ty-grotesk{font-family:'Space Grotesk';font-weight:500}
  .ty-grotesk .ty-set{font-weight:400}
  .ty-mono{font-family:'Space Mono';font-weight:700}
  .ty-mono .ty-aa{font-size:18cqw}
  .ty-mono .ty-set{font-weight:400;font-size:2.9cqw}
  /* Photo treatments: Max's original grid; the figures break out past the tiles */
  .cs-img.pt{overflow:visible;padding:0;aspect-ratio:auto;background:none}
  .cs-img.pt img{display:block;width:101.35%;max-width:none;height:auto;margin-left:-1.35%}
  /* Sub-brand logos on white, each sized to the same visual area */
  .cs-img.sb{padding:0;aspect-ratio:auto;display:grid;grid-template-columns:repeat(4,1fr);background:none}
  .sb-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  .sb-cell img{height:auto;max-height:82%;object-fit:contain}
  @media(max-width:520px){.cs-img.sb{grid-template-columns:repeat(2,1fr)}}
  /* Phones: lockups keep a readable size, palette regroups, type stacks */
  @media(max-width:860px){
    .core-lockups .cs-img:first-child{--pad:9%!important}
    .core-lockups .cs-img:last-child{--pad:12%!important}
  }
  @media(max-width:520px){
    .core-palette .cs-swatches{grid-template-columns:repeat(12,1fr)!important;grid-template-rows:none!important;aspect-ratio:auto!important}
    .core-palette .cs-swatch{grid-row:auto!important;grid-column:span 3;aspect-ratio:3/4}
    .core-palette .cs-swatch:nth-child(-n+3){grid-column:span 4;aspect-ratio:1}
    .core-palette .cs-swatch:nth-child(n+8){aspect-ratio:1}
    .ty-display{aspect-ratio:auto!important;gap:20px}
    .ty-display .ty-label{font-size:10px}
    .ty-display .ty-main{flex-direction:column;align-items:flex-start;gap:14px}
    .ty-display .ty-aa{font-size:22cqw}
    .ty-display .ty-weights{display:flex;flex-wrap:wrap;row-gap:2px;text-align:left;white-space:normal;font-size:12px}
    .ty-display .ty-weights br{display:none}
    .ty-display .ty-weights span{margin-right:.7em}
    .ty-display .ty-set{font-size:3.6cqw}
  }
  /* GameSpot is / is not: the guide's own treatment, set on cream beside the palette so the
     Cream swatch runs straight into it. Kanit Black heads, JetBrains Mono on highlight bars. */
  .cs-html.gs-voice{padding:8.9% 3% 6% 5%;justify-content:flex-start;letter-spacing:normal}
  .gs-voice .cols{display:grid;grid-template-columns:1fr 1fr;column-gap:4cqw}
  .gs-voice h3{margin:0 0 4.4cqw;font:900 4.45cqw/1 'Kanit';color:#00191D;white-space:nowrap}
  .gs-voice .not h3{color:#FF2D17}
  .gs-voice ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.05cqw;font:700 2.93cqw/1 'JetBrains Mono'}
  .gs-voice li{display:flex;align-items:center}
  .gs-voice li::before{content:'+';color:#FF2D17;width:.95em;flex:none}
  .gs-voice li span{background:#FFC500;color:#00191D;padding:.42em .12em .38em}
  .gs-voice .not li::before{content:'\2260'}
  .gs-voice .not li span{background:#00191D;color:#FF2D17}
  /* Phones: palette full width, then the voice panel as one piece, both lists side by side, scaled like an image */
  @media(max-width:860px){.gs-palette>.cs-img{grid-column:1 / -1}.gs-palette .cs-swatches{aspect-ratio:3/2!important}}
  /* GameSpot homepage mock: 1px brand Blue keyline */
  .cs-img.has-img:has(img[src$="gs-homepage.jpg"]){border:1px solid #004158!important;box-sizing:border-box}
  /* GameSpot core UI: a product-style component sheet beside the homepage */
  .cs-html.gs-ui{padding:4.5%;justify-content:flex-start;font-family:'Kanit';letter-spacing:normal;background:#F9EDD8!important;color:#1E1E1E!important}
  .gs-ui *{box-sizing:border-box}
  .gs-ui>*+*{margin-top:4.6cqw}
  .gs-ui>.hd+*{margin-top:5.6cqw}
  .gs-ui .hd{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:2cqw;border-bottom:1px solid #D6D2C8}
  .gs-ui .hd b{font:700 2.6cqw/1 'Kanit';color:#00191D}
  .gs-ui .mono,.gs-ui .hd span{font:500 1.45cqw/1.2 'JetBrains Mono';color:#7A766D}
  .gs-ui .two{display:grid;grid-template-columns:1fr 1fr;gap:3.2cqw}
  .gs-ui .set{position:relative;border:1px dashed #9747FF;border-radius:.6cqw;padding:2.6cqw 2.2cqw 2.2cqw;background:#fff}
  .gs-ui .set>.nm{position:absolute;left:0;top:-2.6cqw;font:600 1.45cqw/1 'JetBrains Mono';color:#9747FF;white-space:nowrap}
  .gs-ui .set>.nm::before{content:'\25C7  '}
  .gs-ui .tok{display:grid;grid-template-columns:3cqw 1fr auto;align-items:center;column-gap:1.4cqw;row-gap:.9cqw}
  .gs-ui .tok i{width:3cqw;height:3cqw;border-radius:.5cqw;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .gs-ui .tok span{font:500 1.4cqw/1 'JetBrains Mono';color:#1E1E1E}
  .gs-ui .tok em{font:400 1.3cqw/1 'JetBrains Mono';color:#9A958B;font-style:normal}
  .gs-ui .ts{display:grid;grid-template-columns:1fr auto;align-items:baseline;row-gap:1.5cqw;column-gap:1.5cqw;color:#00191D}
  .gs-ui .ts em{font:400 1.3cqw/1 'JetBrains Mono';color:#9A958B;font-style:normal;text-align:right;white-space:nowrap}
  .gs-ui .d1{font:900 3.6cqw/1 'Kanit';text-transform:uppercase}
  .gs-ui .d2{font:700 2.4cqw/1.1 'Kanit'}
  .gs-ui .d3{font:400 1.9cqw/1.3 'Kanit'}
  .gs-ui .d4{font:700 1.5cqw/1 'JetBrains Mono';color:#C200BB}
  .gs-ui .bt{display:grid;grid-template-columns:auto repeat(4,1fr);align-items:center;justify-items:start;column-gap:2cqw;row-gap:1.6cqw}
  .gs-ui .bt .mono{font-size:1.3cqw}
  .gs-ui .b{font:900 1.8cqw/1 'Kanit';text-transform:uppercase;padding:1.3cqw 2.2cqw;color:#00191D;white-space:nowrap}
  .gs-ui .p{background:#FFC500}.gs-ui .p.h{background:#F0B400}.gs-ui .p.a{background:#D9A300;box-shadow:inset 0 .4cqw 0 rgba(0,0,0,.15)}
  .gs-ui .s{background:#00191D;color:#FFC500}.gs-ui .s.h{background:#004158}.gs-ui .s.a{background:#000}
  .gs-ui .gh{box-shadow:inset 0 0 0 .3cqw #00191D}.gs-ui .gh.h{background:rgba(0,25,29,.07)}.gs-ui .gh.a{background:#00191D;color:#F9EDD8}
  .gs-ui .x{opacity:.32}
  .gs-ui .stack{display:flex;flex-direction:column;gap:1.6cqw}
  .gs-ui .in{display:flex;align-items:center;gap:1.2cqw;height:4.6cqw;padding:0 1.6cqw;background:#F9EDD8;font:400 1.8cqw/1 'Kanit';color:#8C877C;box-shadow:inset 0 0 0 1px #CFC6B5}
  .gs-ui .in.f{box-shadow:inset 0 0 0 .35cqw #FFC500;color:#00191D;background:#fff}
  .gs-ui .in.f::after{content:'';width:.2cqw;height:2.4cqw;background:#00191D;margin-left:-.8cqw}
  .gs-ui .in svg{width:1.9cqw;height:1.9cqw;flex:none}
  .gs-ui .tabs{display:flex;border-bottom:.25cqw solid #00191D;font:900 1.9cqw/1 'Kanit';text-transform:uppercase;color:#00191D}
  .gs-ui .tabs span{padding:1.3cqw 1.6cqw 1.1cqw}.gs-ui .tabs span:first-child{padding-left:0}.gs-ui .tabs .on{background:#FFC500;padding-left:1.6cqw}
  .gs-ui .tags{display:flex;gap:1cqw}
  .gs-ui .tag{font:900 1.5cqw/1 'Kanit';text-transform:uppercase;padding:.45cqw .8cqw;color:#00191D}
  .gs-ui .li{position:relative;display:grid;grid-template-columns:1fr 11cqw;column-gap:2cqw;background:#F9EDD8;padding:2cqw;color:#00191D}
  .gs-ui .li h5{margin:.9cqw 0 .9cqw;font:700 1.85cqw/1.15 'Kanit'}
  .gs-ui .li img{width:11cqw!important;height:auto!important;aspect-ratio:16/9;object-fit:cover;display:block}
  .gs-ui .rl{position:absolute;font:600 1.2cqw/1 'JetBrains Mono';color:#F2357E;display:flex;align-items:center;justify-content:center}
  .gs-ui .rl.t{left:2cqw;top:0;height:2cqw;width:.1cqw;border-left:1px solid #F2357E}
  .gs-ui .rl.t b{position:absolute;left:.6cqw;font-weight:600}
  .gs-ui .rl.l{top:50%;left:0;width:2cqw;border-top:1px solid #F2357E}
  .gs-ui .rl.l b{position:absolute;top:.5cqw;font-weight:600}
  .gs-ui .rl.m{top:50%;right:11cqw;width:2cqw;margin-right:2cqw;border-top:1px solid #F2357E}
  .gs-ui .rl.m b{position:absolute;top:.5cqw;font-weight:600}
  .gs-ui .vc{position:relative;background:#F9EDD8;color:#00191D}
  .gs-ui .vc .im{position:relative;border-top:.8cqw solid #FF2D17}
  .gs-ui .vc .im img{width:100%!important;height:auto!important;aspect-ratio:3/1;object-fit:cover;display:block}
  .gs-ui .vc .pl{position:absolute;left:1.2cqw;top:1.2cqw;width:3.6cqw;height:3.6cqw;border-radius:50%;background:#00191D;color:#F9EDD8;display:grid;place-items:center;font-size:1.3cqw}
  .gs-ui .vc .bd{padding:1.8cqw}
  .gs-ui .vc h5{margin:1cqw 0 1cqw;font:700 1.9cqw/1.15 'Kanit'}
  .gs-ui .rl.v{position:absolute;border-left:1px solid #F2357E;width:0}
  .gs-ui .rl.v b{position:absolute;left:.5cqw;font:600 1.2cqw/1 'JetBrains Mono'}
  .gs-ui .rl.h{position:absolute;bottom:calc(100% - 100%);top:auto}
  .gs-ui .ts2{display:grid;grid-template-columns:auto 1fr;column-gap:2cqw;align-items:center;color:#00191D}
  .gs-ui .ts2>*{padding:.6cqw 0;border-top:1px solid #ECE8DF;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:clip}
  .gs-ui .ts2>*:nth-child(-n+2){border-top:0;padding-top:0}
  .gs-ui .ts2 .k{font:500 1.3cqw/1.25 'JetBrains Mono';color:#9A958B;display:flex;flex-direction:column}
  .gs-ui .ts2 .k b{font-weight:500;color:#1E1E1E}
  .gs-ui .ts2 .d1{font:900 3cqw/1 'Kanit';text-transform:uppercase}
  .gs-ui .ts2 .d2{font:700 2.3cqw/1.1 'Kanit'}
  .gs-ui .ts2 .d2b{font:700 2.05cqw/1.1 'Kanit'}
  .gs-ui .ts2 .d3{font:400 1.8cqw/1.3 'Kanit'}
  .gs-ui .ts2 .d5{font:900 1.65cqw/1 'Kanit';text-transform:uppercase}
  .gs-ui .ts2 .d4{font:700 1.45cqw/1 'JetBrains Mono';color:#C200BB}
  .gs-ui .ctl{display:grid;grid-template-columns:auto 1fr;column-gap:2cqw;row-gap:1.2cqw;align-items:center}
  .gs-ui .ctl .k{font:500 1.3cqw/1 'JetBrains Mono';color:#7A766D}
  .gs-ui .ctl .in{height:4.4cqw;font-size:1.7cqw}
  .gs-ui .ctl .tabs{font-size:1.75cqw}
  .gs-ui .ctl .tabs span{padding:1.1cqw 1.3cqw .9cqw}
  .gs-ui .icons{display:flex;gap:1cqw;align-items:center}
  .gs-ui .ib{width:4cqw;height:4cqw;display:grid;place-items:center;background:#00191D;color:#F9EDD8;font-size:2cqw}
  .gs-ui .ib.r{border-radius:50%;font-size:1.4cqw}
  .gs-ui .cc{font:500 1.35cqw/1 'JetBrains Mono';color:#00191D;padding:1cqw 1.2cqw;box-shadow:inset 0 0 0 1px #CFC6B5}
  .gs-ui .icons .sec{font:900 1.75cqw/1 'Kanit';text-transform:uppercase;background:#FFC500;padding:1.1cqw 1.3cqw;margin-left:auto;color:#00191D}
  .gs-ui .two>.set{display:flex;flex-direction:column}
  .gs-ui .two>.set>.tok,.gs-ui .two>.set>.ts2,.gs-ui .two>.set>.ctl{flex:1;align-content:space-between}
  .gs-ui .tok{column-gap:0!important;row-gap:0!important}
  .gs-ui .tok>*{align-self:stretch;display:flex;align-items:center;padding:.9cqw 0}
  .gs-ui .tok>*:nth-child(-n+3){padding-top:0}.gs-ui .tok>*:nth-last-child(-n+3){padding-bottom:0}
  .gs-ui .tok>i{height:auto!important;width:3cqw;box-shadow:none;background:none!important;position:relative;margin-right:1.4cqw}
  .gs-ui .tok>i::before{content:"";width:3cqw;height:3cqw;border-radius:.5cqw;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .gs-ui .tok>span,.gs-ui .tok>em{border-top:1px solid #ECE8DF}.gs-ui .tok>span{padding-left:1.6cqw!important}.gs-ui .tok>span~i{}
  .gs-ui .tok>span:nth-child(2),.gs-ui .tok>em:nth-child(3){border-top:0}
  
  

sections:
- heading: Core Brand Elements
  subhead: Building blocks of the brand story. Logo, color, and typography.
  ground: white
  blocks:
  - layout: full
    items:
    - video: motion-logo-reveal
      alt: The Fandom logo animating in, flame mark cutting through the wordmark
      ratio: video
  - layout: asym-left
    class: core-lockups
    gap: 0
    space: 96
    cols: 3fr 2fr   # cream panel = width of the three primaries below
    items:
    - img: logo-lockup-purple.svg
      alt: Fandom primary lockup, purple wordmark with the flame mark, on cream
      bg: '#F9EDD8'
      pad: 15
    - img: logo-stacked-b-cream.svg
      alt: Fandom stacked lockup reversed in cream, on Fandom purple
      bg: '#520044'
      pad: 27
  - layout: full
    class: core-palette
    space: 0   # butts against the lockups above
    items:
    - swatches:
      - {name: Fandom Red, hex: '#FA005A', row: 1 / 3}
      - {name: Fandom Yellow, hex: '#FFC500', row: 1 / 3}
      - {name: Fandom Purple, hex: '#520044', row: 1 / 3}
      - {name: Cream, hex: '#F9EDD8', hide_name: true}
      - {name: Light Blue, hex: '#86D7DC', hide_name: true}
      - {name: Cornflower, hex: '#6A68CE', hide_name: true}
      - {name: Crimson, hex: '#9B004E', hide_name: true}
      - {name: Dark Gray, hex: '#3A434B', hide_name: true}
      - {name: Light Gray, hex: '#838D86', hide_name: true}
      - {name: Purple Black, hex: '#280033', hide_name: true}
      - {name: Brown, hex: '#C16900', hide_name: true}
      cols: 2fr 2fr 2fr 1fr 1fr 1fr 1fr
      rows: 3fr 2fr   # secondaries (top) taller than tertiaries (bottom)
      alt: 'Fandom palette: primaries red, yellow and purple, then four secondaries over four tertiaries'
      aspect: 1200/440
  - layout: full
    space: 96
    items:
    - html: <div class="ty-label"><span>Rubik</span><span>Primary typeface · display and body</span></div><div class="ty-main"><div class="ty-aa">Aa Bb Cc</div><div class="ty-weights"><span style="font-weight:300">Light</span><br><span style="font-weight:400">Regular</span><br><span style="font-weight:500">Medium</span><br><span style="font-weight:600">SemiBold</span><br><span style="font-weight:700">Bold</span><br><span style="font-weight:800">ExtraBold</span><br><span style="font-weight:900">Black</span></div></div><div class="ty-set">ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>abcdefghijklmnopqrstuvwxyz<br>1234567890!@#$%^&amp;*()</div>
      html_class: ty-display
      alt: Rubik, the primary typeface, in its seven weights
      bg: '#520044'
      ink: '#FFC500'
      aspect: 1200/540
  - layout: grid-2
    gap: 0
    space: 0   # butts against the Rubik panel above
    items:
    - html: <div class="ty-label"><span>Space Grotesk</span><span>Headlines</span></div><div class="ty-aa">Aa Bb Cc</div><div class="ty-set">ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz 0123456789</div>
      html_class: ty-small ty-grotesk
      alt: Space Grotesk, the headline typeface
      bg: '#FFC500'
      ink: '#520044'
      aspect: 600/360
    - html: <div class="ty-label"><span>Space Mono</span><span>Accents and data</span></div><div class="ty-aa">Aa Bb Cc</div><div class="ty-set">ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz 0123456789</div>
      html_class: ty-small ty-mono
      alt: Space Mono, the accent and data typeface
      bg: '#F9EDD8'
      ink: '#FA005A'
      aspect: 600/360

- heading: Styles and Image Treatments
  subhead: Photo treatments, illustration, and iconography. A house style broad enough to hold every fandom.
  ground: white
  blocks:
  - layout: full
    items:
    - img: personas.jpg
      alt: The five Fandom personas, illustrated in the house style
      aspect: 1920/1265
  # Built in Figma (82:16878 + 82:13986), exported 2x. Two adjacent blocks; stack on phones.
  - layout: flush-pair
    space: 96
    items:
    - img: vl-chars-pair.jpg
      alt: Miles Morales, Black Widow, Harry Potter and Isabelle in the Fandom duotone photo treatment, on brand-color panels
      aspect: 600/640
    - img: vl-icons-pair.jpg
      alt: Sixteen Fandom icons in four brand-color columns
      aspect: 600/640

- heading: Motion Design
  subhead: Expressing the brand attributes of passion, celebration, and wonder.
  ground: cream
  blocks:
  - layout: full
    items:
    - video: motion-love-of-fans
      alt: For the love of fans, the brand tagline animated
      ratio: video
  - layout: full
    items:
    - video: motion-persona-network
      alt: The Fandom personas connecting into a network
      ratio: video
  - layout: grid-2
    items:
    - video: motion-mark-pattern
      alt: The flame mark repeated as a moving pattern
      ratio: video
    - video: motion-by-the-numbers
      alt: By the Numbers show open
      ratio: video

- heading: Social Content
  subhead: One system, many franchises. Data stories, character breakdowns, and explainers made for each fandom.
  ground: '#280033'
