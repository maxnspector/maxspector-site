    - {img: social-andor-resistance.jpg, alt: "Andor social takeover: the Resistance", ratio: portrait}
  - layout: full
    width: 792
    space: 96
    items:
    - {img: social-tomcruise.jpg, alt: Tom Cruise by the numbers, aspect: 2400/1500}
  - layout: grid-3
    space: 96
    items:
    - {img: social-eddie.jpg, alt: Eddie Munson wiki data post, ratio: portrait}
    - {img: social-dumbledore.jpg, alt: Dumbledore facts post, ratio: portrait}
    - {img: social-johnwick-v2.jpg, alt: John Wick by the numbers, ratio: portrait}
  - layout: flush-pair
    width: 792
    space: 96
    items:
    - {img: social-glass-onion-a.jpg, alt: Glass Onion odds post, ratio: portrait}
    - {img: social-glass-onion-b.jpg, alt: Glass Onion odds post, continued, ratio: portrait}
  - layout: grid-4
    gap: 0
    space: 96
    items:
    - {img: social-bond-s1.jpg, alt: "The Daniel Craig era of Bond, slide 1", ratio: portrait}
    - {img: social-bond-s2.jpg, alt: "The Daniel Craig era of Bond, slide 2", ratio: portrait}
    - {img: social-bond-s3.jpg, alt: "The Daniel Craig era of Bond, slide 3", ratio: portrait}
    - {img: social-bond-s4.jpg, alt: "The Daniel Craig era of Bond, slide 4", ratio: portrait}

- heading: Presentation Design
  subhead: The business of making people forget they’re viewing a slide deck.
  ground: '#6A68CE'
  blocks:
  - layout: full
    items:
    - {img: pres-template-collage.jpg, alt: Fandom presentation template system, title and section slides, aspect: 2400/1600}
  - layout: full
    space: 96
    items:
    - {img: pres-context-matters.jpg, alt: "Go-to-market deck: context matters", ratio: video}
  - layout: grid-2
    items:
    - {img: pres-allhands-2024.jpg, alt: 2024 all-hands look-ahead title slide, ratio: video}
    - {img: pres-allhands-2025-v2.jpg, alt: 2025 all-hands kickoff title slide, ratio: video}
