    - {img: subbrand-french.svg, alt: Celebrating French Community, bg: '#280033', pad: 14}
    - {img: subbrand-fest-2022.svg, alt: Fandom Fest 2022, bg: '#9B004E', pad: 14}

- heading: Events
  subhead: The brand in the room. Shown here, the Fandom party at San Diego Comic-Con 2023.
