title: Alex AI — Max Spector
description: Designing Alex — an AI recruiter that takes a role from open to shortlist.
cover: cover-keynote.jpg
intro:
  eyebrow: Alex AI
  statement: "Alex is an AI recruiter that interviews every applicant, takes over the busywork, and creates
    space for hiring teams to build candidate relationships. I joined as founding designer and built the
    brand and design systems: the mark, the type and color, the product components, imagery, and animation,
    and everything sales and marketing puts in front of customers."
  meta:
  - label: Roles & Responsibilities
    body: "Brand identity, motion design, and collateral. Product design lead, design system in partnership
      with our founding engineers."
  links_html: Learn more at <a href="https://alex.com" target="_blank" rel="noopener">alex.com</a>
sections:
- heading: Brand Identity
  subhead: "DRAFT — The mark, the palette and the typeface."
