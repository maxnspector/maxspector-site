      aspect: 2400/1560
  - layout: full
    items:
    - img: swag-set.jpg
      alt: Alex employee swag, a branded water bottle, a vibe hire cap, and pens on an embossed journal
      aspect: 2400/991
  - layout: full
    items:
    - img: one-sheet-laptop-mock.jpg
      alt: Alex one-sheet, digital edition, shown on a laptop
