title: Alex AI — Max Spector
description: Designing Alex — an AI recruiter that takes a role from open to shortlist.
cover: cover-keynote-7.jpg
frames: off
nav: standalone
intro:
  eyebrow: Alex AI
  statement: "Alex is an AI recruiter that interviews every applicant, takes over the busywork, and creates space for hiring teams to build candidate relationships. I joined as founding designer and built the brand and design systems, styles, motion, and everything that goes in front of customers."
  meta:
  - label: Roles & Responsibilities
    body: "Brand identity, motion design, and collateral. Product design lead, design system in partnership
      with our founding engineers."
  links_html: See more at <a href="https://alex.com" target="_blank" rel="noopener">alex.com</a>
lead:
  blocks:
  - layout: bleed
    items:
    - embed: anim-end-to-end.html
      poster: anim-end-to-end-poster.jpg
      alt: "Animated walkthrough of the Alex hiring sequence: initiate, match, screen, interview, verify, schedule, hire"
      ratio: wide
      w: 1440
      h: 900
      bg: '#EEF2E1'
      speed: 1.2
sections:
- heading: Brand Identity
  subhead: "DRAFT — The mark, the palette and the typeface."
  blocks:
  - layout: feature
    class: trio
    cols: 874fr 302fr
    height: 604
    columns:
    - - img: identity-lockup-office.jpg
        alt: Alex lockup over a blurred office
        labels: [Identity, '', Primary lockup, '']
        tone: photo
    - - img: identity-mark-light.jpg
        alt: Alex mark, dark green on light
        labels: [Identity, '', Mark — dark on light, '']
      - img: identity-mark-dark.jpg
        alt: Alex mark, light on dark green
        labels: [Identity, '', Mark — light on dark, '']
        tone: dark
  - layout: grid-2
    gap: 0
    items:
    - img: palette-main.jpg
      alt: "Alex main colors: main dark #082900 and main light #EEF2E1"
      aspect: 1200/786
    - img: palette-support.jpg
      alt: "Alex supporting colors: secondary gray and sage, three pastels, accent green and warning red"
      aspect: 1200/786
  - layout: full
    items:
    - img: brand-plate-type-v4.jpg
      alt: DM Sans type specimen in four weights on dark green
      aspect: 2400/1356
  - layout: grid-2
    items:
    - img: brand-art-a.jpg
      alt: Logo construction drawing
    - img: brand-art-b.jpg
      alt: Brand art, applied repeated down the page to a single hired
    - img: brand-art-c.jpg
      frame: true
      alt: Brand art, "interview everyone, hire the best one" set in oversized type
    - img: brand-art-e.jpg
      alt: Brand art, a painted circle around the Alex mark
- heading: Feature Animations
  subhead: DRAFT — Talent matching, interviews, verification and fraud detection.
  blocks:
  - layout: grid-3
    items:
    - embed: anim-engage-instantly.html
      poster: anim-engage-instantly-poster.jpg
      alt: 'Engage instantly: Alex reaching candidates across SMS, WhatsApp, phone, email and video'
      aspect: 440/620
      w: 440
      h: 620
    - embed: anim-evaluate-fairly.html
      poster: anim-evaluate-fairly-poster.jpg
      alt: 'Evaluate fairly: every candidate asked the same question and scored on the same rubric'
      aspect: 440/620
      w: 440
      h: 620
    - embed: anim-hire-faster.html
      poster: anim-hire-faster-poster.jpg
      alt: 'Hire faster: time to interview drops from days to hours'
      aspect: 440/620
      w: 440
      h: 620
  - layout: full
    items:
    - embed: anim-proctor.html
      poster: anim-proctor-poster.jpg
      alt: Cheat detection timeline flagging off-camera reading and a second voice
      ratio: video
      w: 1120
      h: 504
      bg: '#FFFFFF'
      fit: contain
      aspect: 1120/504
  - layout: full
    items:
    - video: anim-coordinator
      alt: Interview coordination animation
      ratio: video
  - layout: feature
    class: stack3
    cols: 704fr 472fr
    height: 686
    columns:
