title: Alex AI — Max Spector
description: Designing Alex — an AI recruiter that takes a role from open to shortlist.
output: alex
cover: cover-keynote-7.jpg
cover_mobile: cover-keynote-7-mobile.jpg
style: wide          # full-width layout, the site design (Max 2026-10-31)
layout: rail         # sticky label rail, the site layout (Max 2026-11-08)
grounds_all: white
frames: off
# nav: standalone removed 2026-11-08 (Max): Alex now has the normal menu, footer links and Next
intro:
  eyebrow: Alex AI
  statement: "Alex is an AI recruiter that interviews every applicant, takes over the busywork, and creates space for hiring teams to build candidate relationships. I joined as founding designer and built the brand and design systems, styles, motion, and everything that goes in front of customers."
  meta:
  - label: Roles & Responsibilities
    body: "Brand identity, motion design, and collateral. Product design lead, design system in partnership
      with our founding engineers."
  links_html: See more at <a href="https://alex.com" target="_blank" rel="noopener">alex.com</a>
sections:
- heading: Identity & Design Language
  id: brand-identity  # keeps the homepage slideshow link working after the rename (2026-11-24)
  subhead: The foundation of the company voice. Logo, color, typography, and brand expressions.
  blocks:
  # interview animation (was the page lead) + subway billboard moved here first (Max 2026-11-10)
  - layout: full
    items:
    - embed: anim-hero-v11.html
      poster: anim-hero-v11-poster.jpg
      alt: "Animated walkthrough of the Alex hiring sequence: initiate, match, screen, interview, verify, schedule, hire"
      ratio: wide
      w: 1440
      h: 900
      bg: '#EEF2E1'
      speed: 1.2
  - layout: full
    items:
    - img: billboard-subway.jpg
      alt: Interview everyone, hire the best subway billboard
      ratio: wide
      wide_aspect: 2400/1710  # shown whole in the split header (Max 2026-11-01)
  - layout: feature
    class: trio
    cols: 874fr 302fr
    height: 604
    columns:
    - - img: identity-lockup-office.jpg
        alt: Alex lockup over a blurred office
        labels:
        - Identity
        - ''
        - Primary lockup
        - ''
        tone: photo
    - - img: identity-mark-light.jpg
        alt: Alex mark, dark green on light
        labels:
        - Identity
        - ''
        - Mark — dark on light
        - ''
      - img: identity-mark-dark.jpg
        alt: Alex mark, light on dark green
        labels:
        - Identity
        - ''
        - Mark — light on dark
        - ''
        tone: dark
  - layout: grid-2
    gap: 0
    items:
    - swatches:
      - {name: Main dark, hex: '#082900'}
      - {name: Main light, hex: '#EEF2E1'}
      cols: 1fr 1fr
      alt: 'Alex main colors: main dark #082900 and main light #EEF2E1'
      aspect: 1200/786
    - swatches:
      - {name: Secondary gray, hex: '#6B7F66'}
      - {name: Secondary sage, hex: '#B7C7A7'}
      - {name: Accent green, hex: '#009B58'}
      - {name: Pastel mint, hex: '#D3E1C9', kind: strip, column: 1 / 4}
      - {name: Pastel tan, hex: '#DFD7C0', kind: strip, column: 1 / 4}
      - {name: Pastel sage, hex: '#BAD1C0', kind: strip, column: 1 / 4}
      cols: 1fr 1fr 1fr
      rows: 47fr 17.67fr 17.67fr 17.67fr
      alt: 'Alex supporting colors: secondary gray, secondary sage and accent green, then three pastels'
      aspect: 1200/786
  - layout: full
    items:
    - img: brand-plate-type-v4.jpg
      alt: DM Sans type specimen in four weights on dark green
      aspect: 2400/1356
  # social carousel replaces the two square social cards (Max 2026-11-24)
  - layout: full
    items:
    - img: social-carousel.jpg
      alt: 'Alex social carousel: a row of vertical posts on dark green, from hire the best to the Alex wordmark to accelerate hiring'
      aspect: 1920/1080
  - layout: full
    items:
    - img: brand-art-wall-mock.jpg
      alt: Four Alex brand art prints hung on a wood-paneled wall, the logo construction, applied and hired, interview everyone, and a painted circle around the mark
      aspect: 2400/1600
- heading: Product in Motion
  subhead: The key product concepts and value propositions, brought to life.
  blocks:
  - layout: grid-3
    items:
    - embed: anim-engage-instantly.html
      poster: anim-engage-instantly-poster.jpg
      alt: 'Engage instantly: Alex reaching candidates across SMS, WhatsApp, phone, email and video'
      aspect: 440/620
      w: 440
      h: 620
    - embed: anim-evaluate-fairly.html
      poster: anim-evaluate-fairly-poster.jpg
      alt: 'Evaluate fairly: every candidate asked the same question and scored on the same rubric'
      aspect: 440/620
      w: 440
      h: 620
    - embed: anim-hire-faster.html
      poster: anim-hire-faster-poster.jpg
      alt: 'Hire faster: time to interview drops from days to hours'
      aspect: 440/620
      w: 440
      h: 620
  - layout: full
    items:
    - embed: anim-verify-product.html
      poster: verify-product-poster.jpg
      alt: 'Verify: Alex breaks down a candidate''s fraud signals over video, on a laptop'
      w: 1120
      h: 747
      fit: cover
      # plays inside Max's laptop mockup (Max 2026-11-24); screen box measured from the PNG's transparent area at 3833 wide
      device:
        img: verify-laptop-mock.webp
        size: [3833, 3005]
        screen: [405, 335, 3037, 1958]
  - layout: full
    items:
    - embed: anim-proctor.html
      poster: anim-proctor-poster.jpg
      alt: Cheat detection timeline flagging off-camera reading and a second voice
      ratio: video
      w: 1120
      h: 504
      bg: '#FFFFFF'
      fit: contain
      aspect: 1200/620
      pad: 0.065
      frame: true
  - layout: full
    items:
    - embed: anim-workflow.html
      poster: anim-workflow-poster.jpg
      alt: 'Workflow animation: a hiring cadence of email, wait, SMS and booking that runs on its own'
      ratio: video
      w: 1600
      h: 900
      bg: '#F5F7EF'
      fit: contain
      frame: true
  - layout: feature
    class: stack3
    cols: 704fr 472fr
    height: 686
    columns:
    - - embed: anim-talent-match.html
        poster: anim-talent-match-poster.jpg
        alt: Talent match animation scoring past applicants from an ATS
        ratio: video
        w: 1440
        h: 810
        bg: '#F9FBF5'
        fit: cover
        span: 519
        zoom: 0.88
        cy: 0.4
        frame: true
      - embed: anim-identity.html
        poster: anim-identity-poster.jpg
        alt: Identity verification animation checking authenticity, selfie match and network integrity
        ratio: video
        w: 1300
        h: 680
        bg: '#F9FBF5'
        fit: contain
        span: 555
        zoom: 0.88
        cx: 0.43
        cy: 0.432
        frame: true
    - - embed: anim-candidate-blueprint.html
        aspect_phone: 932/1462
        poster: anim-candidate-blueprint-poster.jpg
        alt: 'Candidate blueprint building up: resume screen, interview and verification'
        w: 932
        h: 1462
        bg: '#082900'
        fit: contain
        pad: 0.04
        zoom: 0.95
- heading: Extended Design System
  subhead: How Alex shows up for candidates and customers. Photography, office signage, swag, and sales materials.
  blocks:
  - layout: grid-3
