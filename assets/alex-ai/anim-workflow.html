:root {
  /* ============ CORE BRAND COLORS ============ */
  --alex-main-dark:        #082900;  /* Primary brand color — text, dark bg, CTAs */
  --alex-secondary-gray:   #6B7F66;  /* Support color, footer headers, copyright */
  --alex-main-light:       #EEF2E1;  /* Light variant, works on dark bgs */
  --alex-secondary-green:  #B2DE9A;  /* Light accent green, announcement link */
  --alex-action-color:     #009B58;  /* APP site (S1 dashboard) ONLY — never on marketing */
  --alex-secondary-sage:   #B7C7A7;  /* Muted sage, dividers, footer subtext */
  --alex-white:            #FFFFFF;
  --alex-black:            #000000;

  /* ============ NEUTRAL SCALE (green-tinted, NOT generic grays) ============ */
  --alex-n050: #F5F7EF;
  --alex-n100: #F5F7EF;
  --alex-n200: #EEF0E6;
  --alex-n250: #E2E5D6;
  --alex-n300: #D7D9CF;
  --alex-n400: #ACAFA4;
  --alex-n500: #83857D;
  --alex-n600: #62645E;
  --alex-n700: #4A4C47;
  --alex-n800: #31342F;
  --alex-n900: #1E201C;
  --alex-n950: #101209;

  /* ============ TERTIARY / ACCENT ============ */
  --alex-coral:        #D07661;  /* Data viz incomplete, illustrations */
  --alex-pastel-mint:  #D3E1C9;
  --alex-pastel-tan:   #DFD7C0;
  --alex-pastel-sage:  #B1C9B4;

  /* ============ STATUS (App S1 only) ============ */
  --alex-status-sent-text:   #877E77; --alex-status-sent-bg:   #F7F7F7;
  --alex-status-active-text: #057389; --alex-status-active-bg: #E9FFFD;
  --alex-status-paused-text: #BAA800; --alex-status-paused-bg: #FFFCD7;
  --alex-status-review-text: #A358B4; --alex-status-review-bg: #FCF0FF;
  --alex-status-complete-text: #37A600; --alex-status-complete-bg: #ECFFE2;
  --alex-status-incomplete-text: #C84300; --alex-status-incomplete-bg: #FFF0E9;

  /* ============ DECISION (pipeline chips, App S1 only) ============ */
  --alex-decision-submitted-text:  #22484F; --alex-decision-submitted-bg:  #B8F5FE;
  --alex-decision-rejected-text:   #BE3600; --alex-decision-rejected-bg:   #FED1B8;
  --alex-decision-shortlist-text:  #35800C; --alex-decision-shortlist-bg:  #D6FFC1;
  --alex-decision-placed-text:     #892F9D; --alex-decision-placed-bg:     #EADAEE;
  --alex-decision-hired-text:      #205304; --alex-decision-hired-bg:      #A0E42C;

  /* ============ DATA VIZ palette ============ */
  --alex-dv-sent:         #B2DE9A;
  --alex-dv-completed:    #009B58;
  --alex-dv-scheduled:    #2E521D;
  --alex-dv-paused:       #D8DFBE;
  --alex-dv-active:       #799959;
  --alex-dv-incomplete:   #D07661;
  --alex-dv-review:       #082900;
  --alex-dv-opened:       #96681D;
  --alex-dv-applied:      #BABE8B;
  --alex-dv-pending:      #6B6F18;

  /* ============ SEMANTIC FOREGROUND ============ */
  --alex-fg-1: var(--alex-main-dark);       /* primary text, headings */
  --alex-fg-2: var(--alex-n700);            /* body/long-form text */
  --alex-fg-3: var(--alex-secondary-gray);  /* muted: footer headers, copyright */
  --alex-fg-4: var(--alex-n500);            /* placeholder, inactive */
  --alex-fg-on-dark:  var(--alex-main-light);
  --alex-fg-on-dark-muted: var(--alex-secondary-sage);

  /* ============ SEMANTIC BACKGROUNDS ============ */
  --alex-bg-page:     var(--alex-n050);
  --alex-bg-elevated: var(--alex-white);
  --alex-bg-subtle:   var(--alex-n200);    /* feature sections, skeletons */
  --alex-bg-wash:     var(--alex-main-light);
  --alex-bg-dark:     var(--alex-main-dark); /* footer, announcement bar */

  /* ============ BORDERS ============ */
  --alex-border:        var(--alex-n100);
  --alex-border-strong: var(--alex-main-dark);
  --alex-border-hover:  var(--alex-n250);

  /* ============ SPACING (8px base grid) ============ */
