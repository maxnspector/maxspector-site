title: The Fandom Brand — Max Spector
description: Building and running the Fandom brand — identity, motion, social, partnerships, platform
  and place.
cover: cover.jpg
intro:
  eyebrow: The Fandom Brand
  statement: Produced end to end by my team at Fandom, the company’s brand identity targets the consumer
    audience with the fun, excitement, and boundless joy that come with a love of imagined worlds. To
    the business audience it tells the story of Fandom’s massive, global reach, its platform, and a diverse
    user base.
  meta:
  - label: Roles & Responsibilities
    body: Art direction, leadership, and design. Directed scope, strategy, process, timelines, and talent.
  - label: Contributing Designers
    body: Dylan Abuel, Nick Tam, Kevin Orzel, Winh Do, Risha Egart, Dermot Jiang, Colleen Starr, Eric
      Neff
  links_html: View the <a href="#">online brand assets</a> or download the full <a href="#">brand guide</a>
