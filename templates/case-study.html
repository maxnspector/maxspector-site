<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}" />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="cs-page">

<header class="nav" id="nav">
  <div class="nav-inner">
    <a href="/" aria-label="Max Spector — home">
      <svg class="monogram" viewBox="0 0 65 65" fill="currentColor" aria-hidden="true" focusable="false"><path d="M17.91,50.71l3.31-6.64,3.31,6.64h-6.62ZM50.95,54.7l-5.37-5.82,7.73-8.28h-4.22l-5.62,6.07-5.56-6.07h-4.22l7.68,8.29-8.35,8.89h4.27l6.22-6.66,4.98,5.42c-4.58,3.05-10.07,4.83-15.97,4.83-6.41,0-12.33-2.1-17.13-5.65l1.06-2.1h9.56l2.07,4.15h3.54l-8.82-17.19h-3.11l-6.74,13.11c-5.71-5.28-9.3-12.83-9.3-21.2,0-9.08,4.21-17.18,10.78-22.48v26.86h3.62V7.88h.09l12.78,29h3.31l12.69-29h.09v29h3.62V10.02c6.57,5.3,10.79,13.41,10.79,22.48s-4.06,16.89-10.43,22.2M32.5,3.62c4.02,0,7.86.83,11.34,2.32l-11.34,25.8L21.16,5.94c3.48-1.49,7.32-2.32,11.34-2.32M32.5,0C14.58,0,0,14.58,0,32.5s14.58,32.5,32.5,32.5,32.5-14.58,32.5-32.5S50.42,0,32.5,0"/></svg>
    </a>
    <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>
  </div>
</header>

<div class="overlay" id="overlay">
  <nav>
{{NAV}}
  </nav>
</div>

<!-- COVER -->
<section class="cs-cover">
  <div class="cs-cover-media has-img" style="background-image:url('{{COVER}}')"></div>
  <a class="cs-scroll" href="#intro" aria-label="Scroll to content">
    <svg viewBox="0 0 36 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1L18 15 35 1"/></svg>
  </a>
</section>

{{INTRO}}

{{SECTIONS}}

<footer class="foot wrap rise-in">
  <span>&copy; Max Spector 2026</span>
  <span><a href="mailto:max@maxspector.com">Email</a> &nbsp;&middot;&nbsp; <a href="https://www.linkedin.com/in/maxspector/">LinkedIn</a></span>
</footer>

<script>
const nav=document.getElementById('nav');let lastY=scrollY,navHidden=false;
const coverMedia=document.querySelector('.cs-cover-media');
const reduceMotion=matchMedia('(prefers-reduced-motion:reduce)').matches;
let ticking=false;
function onScroll(){const y=scrollY;
  nav.classList.toggle('scrolled',y>40);
  if(y>lastY&&y>140&&!navHidden){nav.classList.add('nav-hidden');navHidden=true;}
  else if(y<lastY&&navHidden){nav.classList.remove('nav-hidden');navHidden=false;}
  lastY=y;
  if(coverMedia&&!reduceMotion){coverMedia.style.transform=`translate3d(0,${(y*0.15).toFixed(1)}px,0) scale(1.3)`;}
  ticking=false;}
addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(onScroll);ticking=true;}},{passive:true});
onScroll();
const menuBtn=document.getElementById('menuBtn'),overlay=document.getElementById('overlay');
menuBtn.addEventListener('click',()=>{nav.classList.remove('nav-hidden');navHidden=false;const o=overlay.classList.toggle('open');menuBtn.classList.toggle('open',o);menuBtn.setAttribute('aria-expanded',o);document.body.style.overflow=o?'hidden':'';document.body.classList.toggle('menu-open',o);});
overlay.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{overlay.classList.remove('open');menuBtn.classList.remove('open');document.body.style.overflow='';document.body.classList.remove('menu-open');}));
const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.12});
document.querySelectorAll('.reveal,.rise-in').forEach(el=>io.observe(el));
/* video: play only while on screen. Under prefers-reduced-motion nothing
   autoplays — the poster stands in and the viewer gets controls instead. */
/* HTML animation embeds: scale the authored canvas to fit its frame, and don't
   load the file at all until the frame is near the viewport. Under
   prefers-reduced-motion nothing loads — the poster still stands in. */
const embeds=[...document.querySelectorAll('.cs-img.is-embed')];
if(embeds.length){
  const fit=el=>{
    const f=el.querySelector('iframe'); if(!f) return;
    const r=el.getBoundingClientRect(); if(!r.width) return;
    const w=+el.dataset.w||1440, h=+el.dataset.h||900;
    const s=el.dataset.fit==='contain'?Math.min(r.width/w,r.height/h):Math.max(r.width/w,r.height/h);
    f.style.width=w+'px'; f.style.height=h+'px';
    f.style.transform=`scale(${s}) translate(${(r.width/s-w)/2}px,${(r.height/s-h)/2}px)`;
  };
  embeds.forEach(fit);
  addEventListener('resize',()=>embeds.forEach(fit),{passive:true});
  if(!reduceMotion){
    const eio=new IntersectionObserver((es)=>{es.forEach(e=>{
      if(!e.isIntersecting) return;
      const el=e.target, f=el.querySelector('iframe');
      if(f && !f.src){ f.src=el.dataset.embed; f.addEventListener('load',()=>{fit(el);el.classList.add('embed-live');},{once:true}); }
      fit(el); eio.unobserve(el);
    });},{rootMargin:'200px'});
    embeds.forEach(el=>eio.observe(el));
  }
}
const vids=[...document.querySelectorAll('.cs-img video')];
if(vids.length){
  if(reduceMotion){vids.forEach(v=>{v.controls=true;v.preload='metadata';});}
  else{
    const vio=new IntersectionObserver((es)=>{es.forEach(e=>{
      const v=e.target;
      if(e.isIntersecting){if(v.preload!=='auto'){v.preload='auto';}v.play().catch(()=>{});}
      else{v.pause();}
    });},{threshold:.25});
    vids.forEach(v=>vio.observe(v));
  }
}
</script>
</body>
</html>
